<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LittleStars Academy - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>


<body class="login-page d-flex align-items-center justify-content-center min-vh-100 py-4">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
        
        <div class="card login-card p-4 p-md-5 shadow-lg border-0">
          <div class="text-center mb-4">
            <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
              <i class="bi bi-stars fs-2"></i>
            </div>
            <h4 class="fw-bold text-dark">LittleStars Academy</h4>
            <p class="text-muted small">Teacher & Admin Portal Login</p>
          </div>

          <div id="loginAlert" class="alert alert-danger d-none py-2 small" role="alert">
            Invalid email or password. Please try again!
          </div>

          <!-- Calls function from script.js -->
          <form id="loginForm" onsubmit="handleLoginRedirect(event)">
            <div class="mb-3">
              <label for="loginEmail" class="form-label small fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-envelope text-black-50"></i></span>
                <input type="email" class="form-control" id="loginEmail" value="teacher@littlestars.edu.my" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="loginPassword" class="form-label small fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-lock text-black-50"></i></span>
                <input type="password" class="form-control" id="loginPassword" value="password123" required>
              </div>
            </div>

            <div class="alert alert-info py-2 small mb-3 border-0 bg-info bg-opacity-10 text-info-emphasis">
              <i class="bi bi-info-circle-fill me-1"></i> <strong>Demo Credentials:</strong><br>
              Email: <code>teacher@littlestars.edu.my</code><br>
              Pass: <code>password123</code>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold hover-lift py-2">
              <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
          </form>
        </div>

      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
